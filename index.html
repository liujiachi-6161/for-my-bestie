<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💍 婚礼纪念 · 我们的故事</title>
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #faf7f2;
            color: #3d2c1e;
            padding: 20px 0 60px;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 0 18px;
        }

        /* ===== 页头 ===== */
        .header {
            text-align: center;
            padding: 30px 0 20px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #a67c6b;
        }

        .header p {
            font-size: 14px;
            color: #b8a094;
            margin-top: 6px;
            letter-spacing: 2px;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: #dccfc7;
            margin: 16px auto 0;
        }

        /* ===== 每个环节 ===== */
        .section {
            margin-top: 40px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: #5a4033;
            padding-bottom: 8px;
            border-bottom: 2px solid #e6dbd3;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title span {
            font-size: 22px;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 14px;
        }

        .photo-grid img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            background: #f0ebe6;
        }

        .photo-grid img:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.10);
        }

        /* ===== 视频区域 ===== */
        .video-wrapper {
            margin-top: 14px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            background: #1a1a1a;
        }

        .video-wrapper video {
            display: block;
            width: 100%;
            height: auto;
            max-height: 540px;
            object-fit: contain;
            background: #0d0d0d;
        }

        /* ===== 页脚 ===== */
        .footer {
            text-align: center;
            margin-top: 50px;
            padding-top: 24px;
            border-top: 1px solid #e6dbd3;
            font-size: 13px;
            color: #b8a094;
            letter-spacing: 1px;
        }

        /* ===== 适配小屏手机 ===== */
        @media (max-width: 480px) {
            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            .photo-grid img {
                height: 150px;
            }

            .header h1 {
                font-size: 22px;
            }

            .section-title {
                font-size: 17px;
            }
        }
    </style>
</head>

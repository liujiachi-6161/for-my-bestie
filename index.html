<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💍 婚礼纪念 · 我们的故事</title>

    <!-- Google Fonts 花体英文 + 优雅衬线中文 -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@400;600&family=Noto+Serif+SC:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />

    <!-- GLightbox 图片弹窗 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" />

    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Serif SC", "Playfair Display", "Georgia", serif;
            background: #fcf9f7;
            color: #2c2c2c;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== 整体布局 ===== */
        .app {
            display: flex;
            height: 100vh;
            width: 100vw;
            background: #fcf9f7;
        }

        /* ===== 左侧目录 ===== */
        .sidebar {
            width: 250px;
            min-width: 250px;
            background: #faf7f4;
            border-right: 1px solid #ebe3db;
            display: flex;
            flex-direction: column;
            padding: 40px 20px 28px;
            height: 100vh;
            position: sticky;
            top: 0;
            overflow-y: auto;
            box-shadow: 2px 0 30px rgba(0, 0, 0, 0.03);
            z-index: 10;
        }

        .sidebar-brand {
            text-align: center;
            padding-bottom: 22px;
            border-bottom: 2px solid #ebe3db;
            margin-bottom: 20px;
            position: relative;
        }

        .sidebar-brand .floral-line {
            font-size: 20px;
            letter-spacing: 10px;
            color: #cfb8ab;
            display: block;
            margin-bottom: 2px;
            font-weight: 300;
        }

        .sidebar-brand .brand-cn {
            font-family: "Noto Serif SC", serif;
            font-size: 20px;
            font-weight: 600;
            color: #5a4033;
            letter-spacing: 4px;
            line-height: 1.3;
        }

        .sidebar-brand .brand-en {
            font-family: "Great Vibes", cursive;
            font-size: 28px;
            font-weight: 400;
            color: #b28b7a;
            letter-spacing: 1px;
            display: block;
            margin-top: -2px;
        }

        .sidebar-brand .brand-sub {
            font-family: "Dancing Script", cursive;
            font-size: 14px;
            color: #c4b0a2;
            margin-top: 2px;
            letter-spacing: 2px;
        }

        .sidebar-nav {
            flex: 1;
            padding: 4px 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 18px;
            margin: 4px 0;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: "Noto Serif SC", serif;
            font-size: 15px;
            color: #7a6b5e;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            letter-spacing: 0.5px;
        }

        .nav-item:hover {
            background: #f0e8e2;
            transform: translateX(6px);
            color: #4a3a2e;
            box-shadow: 0 2px 12px rgba(90, 64, 51, 0.06);
        }

        .nav-item.active {
            background: #ece1d9;
            color: #4a2e24;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(90, 64, 51, 0.10), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            transform: translateX(8px);
        }

        .nav-item .icon {
            font-size: 20px;
            width: 32px;
            text-align: center;
            flex-shrink: 0;
        }

        .nav-item .label {
            flex: 1;
        }

        .nav-item .badge {
            font-family: "Dancing Script", cursive;
            font-size: 12px;
            color: #b8a89a;
            background: #f0e8e2;
            padding: 0 12px;
            border-radius: 20px;
            line-height: 20px;
            transition: all 0.3s ease;
        }

        .nav-item.active .badge {
            background: #dccfc7;
            color: #5a4033;
        }

        .sidebar-footer {
            padding-top: 18px;
            border-top: 2px solid #ebe3db;
            margin-top: 8px;
        }

        .btn-view-all {
            width: 100%;
            padding: 12px 0;
            border: 1.5px solid #ddd0c6;
            border-radius: 40px;
            background: transparent;
            color: #8a7a6c;
            font-family: "Noto Serif SC", serif;
            font-size: 14px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .btn-view-all:hover {
            background: #f0e8e2;
            border-color: #c4b5a8;
            color: #4a3a2e;
            transform: scale(1.02);
            box-shadow: 0 4px 16px rgba(90, 64, 51, 0.08);
        }

        .btn-view-all.active-mode {
            background: #ece1d9;
            border-color: #c4b5a8;
            color: #4a2e24;
            box-shadow: 0 4px 16px rgba(90, 64, 51, 0.08);
        }

        /* ===== 右侧主内容 ===== */
        .main {
            flex: 1;
            height: 100vh;
            overflow-y: auto;
            padding: 40px 48px 60px;
            background: #fcf9f7;
            scroll-behavior: smooth;
        }

        /* ===== 章节 ===== */
        .chapter {
            display: none;
            animation: bounceIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .chapter.active {
            display: block;
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.95) translateY(16px);
            }
            60% {
                opacity: 1;
                transform: scale(1.015) translateY(-3px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .app.show-all .chapter {
            display: block !important;
            animation: fadeUp 0.45s ease forwards;
            margin-bottom: 56px;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(14px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .app.show-all .chapter:last-child {
            margin-bottom: 0;
        }

        /* ===== 章节头部 ===== */
        .chapter-header {
            margin-bottom: 24px;
            padding-bottom: 14px;
            border-bottom: 2px solid #ebe3db;
            position: relative;
        }

        .chapter-header .floral-divider {
            font-size: 18px;
            letter-spacing: 12px;
            color: #cfb8ab;
            display: block;
            margin-bottom: 2px;
            font-weight: 300;
        }

        .chapter-header .title-cn {
            font-family: "Noto Serif SC", serif;
            font-size: 28px;
            font-weight: 600;
            color: #3d2c1e;
            letter-spacing: 4px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chapter-header .title-cn .emoji {
            font-size: 28px;
        }

        .chapter-header .title-en {
            font-family: "Great Vibes", cursive;
            font-size: 22px;
            font-weight: 400;
            color: #b28b7a;
            letter-spacing: 1px;
            display: block;
            margin-top: -4px;
        }

        .chapter-header .sub {
            font-family: "Dancing Script", cursive;
            font-size: 17px;
            color: #c4b0a2;
            margin-top: 2px;
            letter-spacing: 1px;
        }

        /* ===== 图片网格 ===== */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 18px;
            margin-top: 8px;
        }

        .photo-grid .photo-item {
            width: 100%;
            height: 220px;
            border-radius: 18px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.05);
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: #f0ebe6;
        }

        .photo-grid .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s ease;
        }

        .photo-grid .photo-item:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 16px 48px rgba(90, 64, 51, 0.14);
        }

        .photo-grid .photo-item:hover img {
            transform: scale(1.04);
        }

        /* ===== 视频 ===== */
        .video-container {
            margin-top: 8px;
            border-radius: 20px;
            overflow: hidden;
            background: #1a1a1a;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        }

        .video-container video {
            display: block;
            width: 100%;
            height: auto;
            max-height: 600px;
            object-fit: contain;
            background: #0d0d0d;
        }

        /* ===== 滚动条 ===== */
        .main::-webkit-scrollbar {
            width: 4px;
        }
        .main::-webkit-scrollbar-track {
            background: #f0ebe6;
        }
        .main::-webkit-scrollbar-thumb {
            background: #d4c5b8;
            border-radius: 4px;
        }

        .sidebar::-webkit-scrollbar {
            width: 3px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #e0d6ce;
            border-radius: 4px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 820px) {
            .sidebar {
                width: 200px;
                min-width: 200px;
                padding: 28px 14px 20px;
            }
            .sidebar-brand .brand-cn {
                font-size: 17px;
            }
            .sidebar-brand .brand-en {
                font-size: 24px;
            }
            .chapter-header .title-cn {
                font-size: 24px;
            }
            .chapter-header .title-en {
                font-size: 19px;
            }
            .photo-grid {
                grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
                gap: 14px;
            }
            .photo-grid .photo-item {
                height: 180px;
                border-radius: 14px;
            }
            .main {
                padding: 28px 28px 40px;
            }
        }

        @media (max-width: 600px) {
            body {
                overflow: auto;
                height: auto;
            }
            .app {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }
            .sidebar {
                width: 100%;
                min-width: unset;
                height: auto;
                max-height: 58px;
                overflow: hidden;
                flex-direction: row;
                padding: 0 16px;
                border-right: none;
                border-bottom: 1px solid #ebe3db;
                background: #faf7f4;
                position: sticky;
                top: 0;
                z-index: 100;
                transition: max-height 0.4s ease;
                box-shadow: 0 2px 16px rgba(0, 0, 0, 0.03);
            }
            .sidebar.open {
                max-height: 440px;
                overflow-y: auto;
                flex-direction: column;
                padding: 12px 16px 16px;
            }
            .sidebar-brand {
                padding: 10px 0 8px;
                border-bottom: none;
                margin-bottom: 0;
                display: flex;
                align-items: center;
                justify-content: space-between;
                width: 100%;
                flex-shrink: 0;
                cursor: pointer;
            }
            .sidebar-brand .brand-cn {
                font-size: 17px;
            }
            .sidebar-brand .brand-en {
                font-size: 22px;
            }
            .sidebar-brand .brand-sub {
                display: none;
            }
            .sidebar-brand .floral-line {
                display: none;
            }
            .menu-toggle {
                font-size: 24px;
                color: #a67c6b;
                background: none;
                border: none;
                cursor: pointer;
                padding: 4px 8px;
            }
            .sidebar-nav {
                padding: 4px 0 8px;
                width: 100%;
            }
            .nav-item {
                padding: 8px 14px;
                font-size: 14px;
            }
            .sidebar-footer {
                display: none;
            }
            .sidebar.open .sidebar-footer {
                display: block;
                width: 100%;
                padding: 12px 0 4px;
                border-top: 1px solid #ebe3db;
            }
            .main {
                padding: 16px 16px 40px;
                height: auto;
                overflow: visible;
                flex: 1;
            }
            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .photo-grid .photo-item {
                height: 150px;
                border-radius: 12px;
            }
            .chapter-header .title-cn {
                font-size: 20px;
            }
            .chapter-header .title-en {
                font-size: 17px;
            }
            .chapter-header .sub {
                font-size: 14px;
            }
            .video-container video {
                max-height: 300px;
            }
            .app.show-all .chapter {
                margin-bottom: 36px;
            }
        }

        /* 移动端菜单按钮显示 */
        .sidebar .sidebar-brand .menu-toggle {
            display: none;
        }
        @media (max-width: 600px) {
            .sidebar .sidebar-brand .menu-toggle {
                display: block;
            }
        }

        /* ===== GLightbox 弹窗阴影增强 ===== */
        .glightbox-container .gslide-media {
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
            border-radius: 12px;
            overflow: hidden;
        }

        .glightbox-container .gslide-image img {
            border-radius: 12px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.40);
        }

        .glightbox-container .gslide-description {
            background: rgba(252, 249, 247, 0.92);
            backdrop-filter: blur(8px);
            border-radius: 0 0 16px 16px;
            padding: 18px 28px;
            font-family: "Noto Serif SC", serif;
            color: #3d2c1e;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.10);
        }

        .glightbox-container .gclose,
        .glightbox-container .gnext,
        .glightbox-container .gprev {
            filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.3));
        }
    </style>
</head>
<body>

    <!-- ===== 飘落花瓣容器（必须放在 body 最前面） ===== -->
    <div id="sakura-container" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;overflow:hidden;"></div>

    <!-- ===== 左侧目录 + 右侧内容 ===== -->
    <div class="app" id="app">

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand" id="menuToggle">

                <button class="menu-toggle" id="menuBtn" aria-label="菜单">☰</button>

            <nav class="sidebar-nav" id="navList">

                <button class="nav-item" data-target="chapter-outdoor">

                <button class="nav-item" data-target="chapter-reception">
                    <span class="icon">🚗</span>

                    <span class="badge">8</span>
                </button>
                <button class="nav-item" data-target="chapter-ceremony">
                    <span class="icon">💍</span>
                    <span class="label">仪式 · 盟约</span>
                    <span class="badge">8</span>
                </button>
                <button class="nav-item" data-target="chapter-video">
                    <span class="icon">🎬</span>
                    <span class="label">全程影像</span>
                    <span class="badge">🎥</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <button class="btn-view-all" id="viewAllBtn">📖 查看全部</button>
            </div>
        </aside>

        <!-- ===== 主内容 ===== -->
        <main class="main" id="mainContent">

            <!-- 花墙 -->
            <section class="chapter active" id="chapter-flower">
                <div class="chapter-header">
                    <span class="floral-divider">❁ ✿ ❁</span>
                    <div class="title-cn"><span class="emoji">🌸</span> 花墙 · 晨光</div>
                    <span class="title-en">Morning Glow</span>
                    <div class="sub">晨光熹微，花香满径</div>
                </div>
                <div class="photo-grid">
                    <a href="https://pic1.imgdb.cn/i/034K67EC5TzerNqc8ZvAfZ.jpg" class="glightbox"><div class="photo-item"><img src="https://pic1.imgdb.cn/i/034K67EC5TzerNqc8ZvAfZ.jpg" alt="花墙1" loading="lazy" /></div></a>
                    <a href="https://pic1.imgdb.cn/i/034K67Sp2mo5i5kdJZ9XHM.jpg" class="glightbox"><div class="photo-item"><img src="https://pic1.imgdb.cn/i/034K67Sp2mo5i5kdJZ9XHM.jpg" alt="花墙2" loading="lazy" /></div></a>
                    <a href="https://pic1.imgdb.cn/i/034K67aCcMySlHcsleE0Lm.jpg" class="glightbox"><div class="photo-item"><img src="https://pic1.imgdb.cn/i/034K67aCcMySlHcsleE0Lm.jpg" alt="花墙3" loading="lazy" /></div></a>
                    <a href="https://pic1.imgdb.cn/i/034K67Ecbd0eaH6dLUH0hv.jpg" class="glightbox"><div class="photo-item"><img src="https://pic1.imgdb.cn/i/034K67Ecbd0eaH6dLUH0hv.jpg" alt="花墙4" loading="lazy" /></div></a>
                    <a href="https://pic1.imgdb.cn/i/034K67ZaP1Yj0CRqbZ3vBT.jpg" class="glightbox"><div class="photo-item"><img src="https://pic1.imgdb.cn/i/034K67ZaP1Yj0CRqbZ3vBT.jpg" alt="花墙5" loading="lazy" /></div></a>
                    <a href="https://pic1.imgdb.cn/i/034K67NMUqPlDZXMh4Tqte.jpg" class="glightbox"><div class="photo-item"><img src="https://pic1.imgdb.cn/i/034K67NMUqPlDZXMh4Tqte.jpg" alt="花墙6" loading="lazy" /></div></a>
                    <a href="https://pic1.imgdb.cn/i/034K67apDcGLkVbIVo5oke.jpg" class="glightbox"><div class="photo-item"><img src="https://pic1.imgdb.cn/i/034K67apDcGLkVbIVo5oke.jpg" alt="花墙7" loading="lazy" /></div></a>

            </section>

            <!-- 户外 -->
            <section class="chapter" id="chapter-outdoor">
                <div class="chapter-header">
                    <span class="floral-divider">❁ ✿ ❁</span>
                    <div class="title-cn"><span class="emoji">🌳</span> 户外 · 奔赴</div>
                    <span class="title-en">Walk Together</span>
                    <div class="sub">绿荫之下，携手前行</div>
                </div>
                <div class="photo-grid">
                    <a href="https://pic1.imgdb.cn/i/034K6FQvjIY6FaiugUd3OG.jpg" class="glightbox"><div class="photo-item"><img src="https://pic1.imgdb.cn/i/034K6FQvjIY6FaiugUd3OG.jpg" alt="户外1" loading="lazy" /></div></a>
                    <a href="https://pic1.imgdb.cn/i/034K6FOQji2xV4JSo6m3k1.jpg" class="glightbox"><div class="photo-item"><img src="https://pic1.imgdb.cn/i/034K6FOQji2xV4JSo6m3k1.jpg" alt="户外2" loading="lazy" /></div></a>

                    <a href="https://pic1.imgdb.cn/i/034K6FSw0yBrPrc05arDYs.jpg" class="glightbox"><div class="photo-item"><img src="https://pic1.imgdb.cn/i/034K6FSw0yBrPrc05arDYs.jpg" alt="户外7" loading="lazy" /></div></a>

            </section>

            <!-- 接亲 -->
            <section class="chapter" id="chapter-reception">
                <div class="chapter-header">
                    <span class="floral-divider">❁ ✿ ❁</span>
                    <div class="title-cn"><span class="emoji">🚗</span> 接亲 · 欢庆</div>
                    <span class="title-en">Joyful Moment</span>
                    <div class="sub">锣鼓喧天，喜气盈门</div>
                </div>

    <!-- ===== GLightbox 图片弹窗 JS ===== -->
    <script src="https://cdn.jsdelivr.net/gh/mcstudios/glightbox/dist/js/glightbox.min.js"></script>

    <!-- ===== 交互逻辑 ===== -->
    <script>
        (function() {
            // ---- GLightbox 初始化 ----
            const lightbox = GLightbox({
                touchNavigation: true,
                loop: true,
                zoomable: true,
                autoplayVideos: false,
                openEffect: 'zoom',
                closeEffect: 'zoom',
                slideEffect: 'slide',
                moreLength: 0,
                plyr: {
                    controls: ['play', 'pause', 'volume', 'fullscreen']
                }
            });

            // ---- 目录切换 ----
            const app = document.getElementById('app');
            const navItems = document.querySelectorAll('.nav-item');
            const chapters = document.querySelectorAll('.chapter');
            const viewAllBtn = document.getElementById('viewAllBtn');
            const sidebar = document.getElementById('sidebar');
            const menuBtn = document.getElementById('menuBtn');
            const menuToggle = document.getElementById('menuToggle');

            let isViewAll = false;
            let currentTarget = 'chapter-flower';

            function switchChapter(targetId) {
                if (isViewAll) exitViewAll();
                currentTarget = targetId;
                navItems.forEach(item => {
                    item.classList.toggle('active', item.dataset.target === targetId);
                });
                chapters.forEach(ch => {
                    ch.classList.toggle('active', ch.id === targetId);
                });
                if (window.innerWidth <= 600) sidebar.classList.remove('open');
                // 滚动到顶部
                document.getElementById('mainContent').scrollTop = 0;
            }

            function enterViewAll() {
                isViewAll = true;
                app.classList.add('show-all');
                navItems.forEach(item => item.classList.remove('active'));
                viewAllBtn.textContent = '✕ 收起全部';
                viewAllBtn.classList.add('active-mode');
                document.getElementById('mainContent').scrollTop = 0;
                if (window.innerWidth <= 600) sidebar.classList.remove('open');
            }

            function exitViewAll() {
                isViewAll = false;
                app.classList.remove('show-all');
                viewAllBtn.textContent = '📖 查看全部';
                viewAllBtn.classList.remove('active-mode');
                navItems.forEach(item => {
                    item.classList.toggle('active', item.dataset.target === currentTarget);
                });
                chapters.forEach(ch => {
                    ch.classList.toggle('active', ch.id === currentTarget);
                });
            }

            function toggleViewAll() {
                isViewAll ? exitViewAll() : enterViewAll();
            }

            navItems.forEach(item => {
                item.addEventListener('click', function() {
                    const target = this.dataset.target;
                    if (target) switchChapter(target);
                });
            });

            viewAllBtn.addEventListener('click', toggleViewAll);

            // ---- 移动端菜单 ----
            if (menuBtn && menuToggle) {
                menuToggle.addEventListener('click', function(e) {
                    e.stopPropagation();
                    sidebar.classList.toggle('open');
                });
            }

            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 600 && !sidebar.contains(e.target)) {
                    sidebar.classList.remove('open');
                }
            });

            window.addEventListener('resize', function() {
                if (window.innerWidth > 600) sidebar.classList.remove('open');
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && isViewAll) exitViewAll();
            });

        })();
    </script>
